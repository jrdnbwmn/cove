  #     buildCommand: "./bin/render-build.sh"
  #     preDeployCommand: bundle exec rails db:prepare
  #     startCommand: bundle exec rails server
  #     healthCheckPath: "/up"
  #     envVars:
  #       - key: RAILS_MASTER_KEY
  #         sync: false
  #       - key: RAILS_ENV
  #         value: production
  #       - key: RACK_ENV
  #         value: production
  #       # Render defaults WEB_CONCURRENCY to 1, which starts Puma in cluster mode.
  #       - key: WEB_CONCURRENCY
  #         value: "0"
  #       - key: SOLID_QUEUE_IN_PUMA
  #         value: "true"
  #       - key: DATABASE_URL
  #         fromDatabase:
  #           name: cove-production-db
  #           property: connectionString
  #   # `starter` is 512MB, the same ceiling staging OOM'd against, but commit
  #   # b85d959 disabled embedded Solid Queue before 88cd7f3 pinned WEB_CONCURRENCY=0.
  #   # Staging therefore ran cluster-mode Puma plus supervisor, dispatcher, and worker.
  #   # Single-mode Puma with an embedded worker on 512MB has never been tested.
  #   # Escape hatch: split a type: worker service running `bundle exec rake
  #   # solid_queue:start` (about $7/month more) if cutover OOMs.
  # <<<

# Render's "free" databases are deleted after 30 days unless upgraded and only one per workspace.
databases:
  - name: cove-staging-db
    plan: free
    region: oregon # the region must be consistent across all services for the internal keys to be read
    ipAllowList: [] # only allow internal connections

