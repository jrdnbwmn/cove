# Staging blueprint. Production is defined below but commented out until the
# cutover ticket provisions it.
services:
  - type: web
    name: cove-staging
    plan: free
    runtime: ruby
    region: oregon # the region must be consistent across all services for the internal keys to be read
    branch: main
    autoDeploy: true
    buildCommand: "./bin/render-build.sh"
    startCommand: bundle exec rails db:prepare && bundle exec rails server
    healthCheckPath: "/up"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STAGING_EMAIL_RECIPIENT_ALLOWLIST
        sync: false
      - key: RAILS_ENV
        value: staging
      - key: RACK_ENV
        value: staging
      # Render defaults WEB_CONCURRENCY to 1, which starts Puma in cluster mode.
      # Keep the free-tier service in single mode to fit within its 512MB limit.
      - key: WEB_CONCURRENCY
        value: "0"
      # Left off: the free plan's 512MB cap can't absorb the embedded
      # Supervisor + Dispatcher + Worker processes on top of Puma, and this
      # app has no custom background jobs yet to justify running them.
      # - key: SOLID_QUEUE_IN_PUMA
      #   value: true
      - key: DATABASE_URL
        fromDatabase:
          name: cove-staging-db
          property: connectionString

  # >>> production (dormant)
  # services:
  #   # Production is dormant until the cutover ticket. Whether to enable
  #   # autoDeploy for production is a decision for that ticket, not this one.
  #   - type: web
  #     name: cove-production
